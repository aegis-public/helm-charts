apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-refresh-pubsub
spec:
  schedule: "0 0 * * *"  # Run at midnight every day
  suspend: {{ .Values.cronJobs.refreshPubsub.suspend | default false }}
  jobTemplate:
    spec:
      template:
        spec:
          {{- with .Values.refreshCronJob.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.refreshCronJob.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.refreshCronJob.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: refresh-pubsub
            {{- with .Values.refreshCronJob.image }}
            {{- if .repository }}
            image: "{{ .repository }}:{{ .tag }}{{- with .digest }}@{{ . }}{{- end }}"
            {{- else }}
            image: curlimages/curl:latest
            {{- end }}
            {{- end }}
            imagePullPolicy: IfNotPresent
            {{- with .Values.refreshCronJob.securityContext }}
            securityContext:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.refreshCronJob.resources }}
            resources:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            command:
            - /bin/sh
            - -c
            - |
              curl -X POST http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:8080/refresh_subscriptions
          restartPolicy: OnFailure
