{{- if and .Values.externalSecret.enabled .Values.externalSecret.render }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-env
  labels:
    app: {{ .Release.Name }}
  annotations:
    # Left in place when a later upgrade stops rendering it: the target Secret
    # is owned by this object and would be deleted with it.
    helm.sh/resource-policy: keep
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: SecretStore
  target:
    name: {{ .Release.Name }}-env
    creationPolicy: Owner
  data:
    {{- range $name, $secret := .Values.externalSecret.env }}
    - secretKey: {{ $name | quote }}
      remoteRef:
        key: {{ $secret | quote }}
    {{- end }}
{{- end }}
